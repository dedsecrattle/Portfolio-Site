<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- hard offset shadow -->
  <rect x="14" y="14" width="80" height="80" fill="#0f0f0f" />
  <!-- lime block with ink border -->
  <rect x="9" y="9" width="74" height="74" fill="#a3e635" stroke="#0f0f0f" stroke-width="6" />
  <!-- blocky P (built from rects so it renders without any font) -->
  <rect x="26" y="24" width="12" height="52" fill="#0f0f0f" />
  <rect x="26" y="24" width="34" height="10" fill="#0f0f0f" />
  <rect x="48" y="24" width="12" height="30" fill="#0f0f0f" />
  <rect x="26" y="44" width="34" height="10" fill="#0f0f0f" />
  <!-- block caret -->
  <rect x="65" y="56" width="10" height="20" fill="#0f0f0f" />
</svg>
